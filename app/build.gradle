plugins {
    id "com.android.application"
}

android {
    namespace "com.jrvoca.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.jrvoca.app"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    sourceSets {
        main {
            assets.srcDir(layout.buildDirectory.dir("generated/assets"))
        }
    }
}

tasks.register("copyWebAssets", Copy) {
    from(
        rootProject.file("index.html"),
        rootProject.file("manual.html"),
        rootProject.file("qr-code.png")
    )
    into(layout.buildDirectory.dir("generated/assets/www"))
}

tasks.named("preBuild") {
    dependsOn("copyWebAssets")
}
